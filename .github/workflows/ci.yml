name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Reject sorry
        run: "! grep -rnwE 'sorry|admit' EAB"
      - name: Axiom audit
        run: python3 scripts/check_axioms.py
