name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Verification script regressions
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Reject unfinished proofs
        run: python3 scripts/check_proofs.py
      - name: Axiom audit
        run: python3 scripts/check_axioms.py
